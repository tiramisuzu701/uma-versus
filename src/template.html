<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma Versus</title>
<!--__ICONS__-->
<style>
  /*__FONTS__*/
  html,body{margin:0;height:100%;background:#070a18;overflow:hidden;font-family:'Barlow Condensed',system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
  #net{position:fixed;left:50%;top:50%;transform:translate(-50%,-40%);width:min(460px,calc(100vw - 32px));
       background:rgba(12,17,38,.97);border-top:4px solid #f6c343;border-radius:6px;padding:20px 24px;color:#e6e9f8;
       box-shadow:0 14px 44px rgba(0,0,0,.55);font-size:16px}
  #net.hidden,.hidden{display:none!important}
  #net h2{margin:0 0 2px;font:italic 900 34px 'Barlow Condensed',sans-serif;color:#fff;letter-spacing:.01em}
  #net h2::after{content:'';display:block;width:120px;height:4px;margin-top:4px;background:linear-gradient(90deg,#ff4f8b,#f6c343,#2fae5b,#4aa8ff)}
  #net p.sub{margin:8px 0 14px;color:#aeb5d8;font-size:15px}
  #net .row{display:flex;gap:8px;margin:10px 0;align-items:center}
  #net button{font:italic 800 18px 'Barlow Condensed',sans-serif;padding:9px 18px;border:0;background:#ff4f8b;color:#fff;cursor:pointer;
       clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
  #net button.ghost{background:#283466;color:#dfe2f5}
  #net button:hover{filter:brightness(1.12)}
  #net input[type=text]{flex:1;font:800 24px ui-monospace,monospace;letter-spacing:5px;text-transform:uppercase;padding:8px 12px;
       border-radius:4px;border:2px solid #283466;background:#070a18;color:#fff;min-width:0}
  #net select{font:600 16px 'Barlow Condensed',sans-serif;padding:5px;border-radius:4px;background:#070a18;color:#fff;border:1px solid #283466}
  #net label{font-size:15px;color:#c9cfe8}
  #netCodeBox{background:#140c06;border:2px solid #b98512;border-radius:6px;padding:10px 12px;justify-content:space-between}
  #netCode{font:900 32px ui-monospace,monospace;letter-spacing:7px;color:#ffb43a;text-shadow:0 0 10px rgba(255,180,58,.6)}
  #netStatus{min-height:20px;font-size:15px;color:#f6c343;margin-top:8px}
  #net .padfocus{outline:3px solid #f6c343;outline-offset:3px}
  #net hr{border:0;border-top:2px solid #f4f1e8;opacity:.2;margin:12px 0}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="net" class="hidden">
  <h2>ONLINE</h2>
  <p class="sub">Peer-to-peer with rollback netcode. One of you hosts, the other joins with the code.</p>
  <div class="row"><button id="netHost">Host a room</button>
    <label>Input delay <select id="netDelay"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label></div>
  <div class="row hidden" id="netCodeBox"><span id="netCode"></span><button class="ghost" id="netCopy">Copy</button></div>
  <hr>
  <div class="row"><input id="netCodeIn" type="text" maxlength="5" placeholder="CODE" autocomplete="off"><button id="netJoin">Join</button></div>
  <div class="row"><label><input type="checkbox" id="netLocal"> Same computer (two browser tabs, for testing)</label></div>
  <div id="netStatus"></div>
  <div class="row" style="justify-content:flex-end;margin-bottom:0"><button class="ghost" id="netBack">Back</button></div>
</div>
<input type="file" id="repFile" accept=".umarep,.json,application/json" class="hidden">
<script>/*__PEERJS__*/</script>
<script>/*__MUSIC__*/</script>
<script>/*__LOGO__*/</script>
<script>
/*__ASSETS__*/
/*__CODE__*/
</script>
</body>
</html>
